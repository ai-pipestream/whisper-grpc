name: whisper-grpc
services:
  media:
    build: .
    ports:
      - "127.0.0.1:50072:50072"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      WHISPER_MACHINE_ID: ${WHISPER_MACHINE_ID:-}
      WHISPER_WORKER_TARGET: ${WHISPER_WORKER_TARGET:-}
  speech:
    profiles: [speech]
    build: .
    entrypoint: ["/usr/local/bin/whisper-speech-worker"]
    ports:
      - "127.0.0.1:50073:50073"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      WHISPER_WORKER_LISTEN: 0.0.0.0:50073
      WHISPER_MODEL_PATH: /models/model.bin
      WHISPER_MODEL_ID: ${WHISPER_MODEL_ID:-tiny.en}
      WHISPER_THREADS: ${WHISPER_THREADS:-4}
      WHISPER_MACHINE_ID: ${WHISPER_MACHINE_ID:-}
    volumes:
      - type: bind
        source: ${WHISPER_MODEL_PATH:-./models/ggml-tiny.en.bin}
        target: /models/model.bin
        read_only: true
        bind:
          create_host_path: false
